# Alembic configuration file.
# Do NOT hard-code passwords here — the sqlalchemy.url is overridden
# by env.py, which reads from the DATABASE_URL environment variable.

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template for revision file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for generated revision timestamps.
timezone = UTC

# Truncate long slugs generated from migration messages.
truncate_slug_length = 40

# sqlalchemy.url is set programmatically in migrations/env.py.
# Leave this blank to avoid accidental hard-coded credentials.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured yet.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
