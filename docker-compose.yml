version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: disastersense_db
    restart: always
    environment:
      POSTGRES_DB: disastersense
      POSTGRES_USER: disastersense
      POSTGRES_PASSWORD: disastersense_prod_pwd_secure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disastersense -d disastersense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: disastersense_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://disastersense:disastersense_prod_pwd_secure@db:5432/disastersense
      SECRET_KEY: disastersense_aws_production_secret_key_super_secure_987654321
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      TELEMETRY_POLL_INTERVAL_SECONDS: 60
      WEATHER_CACHE_TTL_SECONDS: 60
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_MODE: "false"
    container_name: disastersense_frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: disastersense_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
